    <script>
      // Apply saved theme before paint to avoid a flash. Dark is the default.
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light') document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
